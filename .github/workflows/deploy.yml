# ABOUTME: Builds and deploys the app to Azure Static Web Apps for beta and reusable calls.
# ABOUTME: Runs on beta branch pushes and can be called by release workflows for production.

name: Deploy

on:
  push:
    branches:
      - beta
  workflow_call:
    secrets:
      azure_static_web_apps_api_token:
        required: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOYMENT_TOKEN: ${{ secrets.azure_static_web_apps_api_token || secrets.AZURE_STATIC_WEB_APPS_BETA_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install API dependencies
        run: cd api && npm ci

      - name: Install app dependencies
        run: npm ci

      - name: Build
        run: npx vite build

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.DEPLOYMENT_TOKEN }}
          action: "upload"
          app_location: "dist"
          api_location: "api"
          output_location: ""
          skip_app_build: true
