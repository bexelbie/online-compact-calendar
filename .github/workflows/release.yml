# ABOUTME: Creates a GitHub Release and deploys production when a v* tag is pushed.
# ABOUTME: Reuses the shared deploy workflow so production and beta use the same deploy steps.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract release notes from commit message
        id: release_notes
        run: |
          COMMIT_MESSAGE=$(git log -1 --format=%B "${{ github.ref_name }}")
          echo "message<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMIT_MESSAGE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Ensure tag commit is on main
        run: |
          git fetch origin main --depth=1
          git merge-base --is-ancestor "${{ github.sha }}" origin/main

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          body: ${{ steps.release_notes.outputs.message }}
          draft: false
          prerelease: false

  deploy:
    needs: release
    uses: ./.github/workflows/deploy.yml
    secrets:
      azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
