# ABOUTME: Creates a GitHub Release and deploys production when a v* tag is pushed.
# ABOUTME: Reuses the shared deploy workflow so production and beta use the same deploy steps.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure tag commit is on main
        run: |
          git fetch origin main --depth=1
          git merge-base --is-ancestor "${{ github.sha }}" origin/main

      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --notes-from-tag
        env:
          GH_TOKEN: ${{ github.token }}

  deploy:
    needs: release
    uses: ./.github/workflows/deploy.yml
    secrets:
      swa_deployment_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
